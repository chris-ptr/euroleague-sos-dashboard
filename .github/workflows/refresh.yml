name: Refresh EuroLeague SoS data

on:
  schedule:
    # Daily is ample: EuroLeague plays ~2 rounds/week, and a no-op run still
    # touches Supabase, which keeps the free project from idling into a pause.
    # Use workflow_dispatch to pull a round in immediately when one finishes.
    - cron: "0 6 * * *"
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    # The compute path calls the euroleague_api per-game stats endpoint once per
    # game, so a slow/hanging upstream shouldn't burn Actions minutes forever.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Refresh and publish
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/refresh_and_publish.py

# Failure alerting is GitHub's built-in email for scheduled workflows, which goes
# to whoever last edited this file — deliberately no custom notify step, since the
# repo's workflow token is read-only (Settings > Actions > Workflow permissions)
# and anything needing issues:write would 403 and mark every run failed.
# This matters: a round-39 crash sat undetected for a week in July 2026.
